<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rosí | Lunchroom in Monster</title>
    <meta
      name="description"
      content="Lunchroom in het hart van Monster. Verse koffie, huisgemaakte lunch en taart."
    />
    <meta name="theme-color" content="#7f8a5e" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/lunchroom-rosi/fonts/fraunces-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/lunchroom-rosi/fonts/dm-sans-latin.woff2"
      crossorigin
    />
    <script>
      // SPA GitHub Pages routing: restore path from query string set by 404.html
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
